[project]
name = "charla-redes-neuronales-practica"
version = "0.1.0"
description = "Parte práctica de la charla: una red neuronal a mano, paso a paso."
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.9",
    "torch>=2.4",
    "ipykernel>=6.29",
    "pandas>=2.2",
    "scikit-learn>=1.9.1",
    "torchvision>=0.28.0",
    "optuna>=5.0.0",
    "ipywidgets>=8.1.9",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
